name: Build Android AAB (signed)

on:
  push:
    branches:
      - "release/android-v1.1.2-embedded-banner"
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode (naikkan setiap rilis Play Store)
        required: true
        default: "1"
      version_name:
        description: Android versionName
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build-signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || (echo "ANDROID_KEYSTORE_BASE64 belum diatur" && exit 1)
          test -n "$STORE_PASS" || (echo "ANDROID_KEYSTORE_PASSWORD belum diatur" && exit 1)
          test -n "$KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS belum diatur" && exit 1)
          test -n "$KEY_PASS" || (echo "ANDROID_KEY_PASSWORD belum diatur" && exit 1)

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore encrypted upload key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/gurules-upload-key.jks
          chmod 600 android/app/gurules-upload-key.jks

      - name: Prepare signed GuruLes release
        env:
          ANDROID_VERSION_CODE: ${{ inputs.version_code || '6' }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name || '1.1.2' }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/gurules-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run android:prepare

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/gurules-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab
          sha256sum android/app/build/outputs/bundle/release/app-release.aab | tee android/app/build/outputs/bundle/release/app-release.aab.sha256

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: gurules-signed-aab-v${{ inputs.version_name || '1.1.2' }}-${{ inputs.version_code || '6' }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove upload key from runner
        if: always()
        shell: bash
        run: rm -f android/app/gurules-upload-key.jks
