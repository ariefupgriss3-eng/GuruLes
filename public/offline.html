<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b6bdc" />
  <title>GuruLes - Offline</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5fbff;color:#16324f;padding:24px}
    main{max-width:520px;text-align:center;background:#fff;border:1px solid #dbeafe;border-radius:24px;padding:32px;box-shadow:0 20px 50px rgba(15,76,129,.12)}
    .logo{width:88px;height:88px;border-radius:24px;background:#0b6bdc;color:#fff;display:grid;place-items:center;margin:0 auto 20px;font-weight:800;font-size:30px}
    h1{margin:0 0 12px}
    p{line-height:1.6;color:#52677d}
    button{border:0;border-radius:12px;background:#0b6bdc;color:#fff;font-weight:700;padding:12px 18px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="logo">GL</div>
    <h1>GuruLes sedang offline</h1>
    <p>Periksa koneksi internet Anda. Halaman yang pernah dibuka tetap dapat tersedia dari cache.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </main>
</body>
</html>
